<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New webpage</title>

    <!-- Link CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- JS file -->
    <script src="app.js" defer></script>
</head>

<body>
<h1>Welcome to My Webpage</h1>

<p>
    Hello! My name is Karima. I have take web design course.
    So I'm reviewing the basic of programming and web development.
    This will be my second time creating a website.
</p>

<h2>User Registration & Information</h2>


<div id="status"></div>

<form id="userForm">
    <h3>Contact Details</h3>

    <div>
        <label for="fname">First Name:</label><br>
        <input type="text" id="fname" required>
    </div>

    <div>
        <label for="lname">Last Name:</label><br>
        <input type="text" id="lname" required>
    </div>

    <div>
        <label for="email">Email Address:</label><br>
        <input type="email" id="email" required>
    </div>

    <div>
        <label for="pword">Password:</label><br>
        <input type="password" id="pword" required>
    </div>

    <button type="submit">Submit</button>
</form>


<h3>Sample List</h3>
<ul id="itemList"></ul>

<!-- FETCH BUTTON -->
<h3>Fetch Data</h3>
<button id="fetchBtn">Load Users</button>
<button id="sortBtn">Sort A–Z</button>


<section id="results"></section>

</body>
</html>
